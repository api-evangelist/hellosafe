  note: >-
    Submitted via apis.io/add on 2026-08-25 and auto-published by the gate at rating 71
    (exemplar). The submitted APIs.json URL is CORRECT — it points at
    /.well-known/apis.json, which returns application/json against a control path that returns a
    real 404. Third submission in a week whose declared pointer actually resolved, after Southend
    and YouWork Agent.
    Every declared property was fetched: the OpenAPI (3.1, 4 paths, 8 schemas), a machine-readable
    api-onboarding document carrying aod, provider, maturity, account, registration,
    authentication, credentials and scopes, and an llms.txt. Only /platform/api 308-redirects
    rather than serving directly, which is why the record points at the URL and not a saved copy.
    WORTH NOTING ON AUTHENTICATION. This API is not bearer-token or plain-API-key. It uses three
    headers — AtlasKeyId, AtlasTimestamp and AtlasSignature — i.e. HMAC request signing with a
    timestamp, which resists replay in a way a static key does not. Very few providers at this
    size ship that, and it is the kind of thing the rubric should be crediting.
    SLUGGED FROM THE COMPANY, NOT THE SUBDOMAIN. The submission is "HelloSafe Atlas" and everything
    is served from atlas.hellosafe.com, but the company is HelloSafe on hellosafe.com, which
    resolves and returns 200. Atlas is the API platform, and the two APIs sit inside the company
    record — the same shape as YouWork Agent / Scopewise.
    Their apis.json declares specificationVersion 0.18, which is several revisions behind current.
    Recorded, not corrected: it is their document.
