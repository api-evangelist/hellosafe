aid: hellosafe
name: HelloSafe
description: >-
  HelloSafe distributes travel insurance through APIs, under the Atlas platform at
  atlas.hellosafe.com. The Travel Insurance API returns multi-insurer pricing, tracked attributed
  links and a pre-sale coverage assessment, aimed at travel agencies, tour operators, OTAs,
  booking engines and travel apps. A second surface, the Coach API, sits alongside it. The
  contract is an OpenAPI 3.1 document of 4 operations and 8 schemas, and requests are
  HMAC-SIGNED rather than bearing a plain API key — three headers, AtlasKeyId, AtlasTimestamp and
  AtlasSignature, which is materially stronger than what most providers this size ship.
